 "きっとうまくいくよ。", "page": 24}, {"id": "1179", "no": 1179, "en": "Take your time.", "ja": "ゆっくりでいいよ。", "page": 24}, {"id": "1180", "no": 1180, "en": "Keep trying.", "ja": "あきらめずに続けて。", "page": 24}, {"id": "1181", "no": 1181, "en": "That's too bad.", "ja": "それは残念だね。", "page": 24}, {"id": "1182", "no": 1182, "en": "Congratulations.", "ja": "おめでとう。", "page": 24}, {"id": "1183", "no": 1183, "en": "I'm happy for you.", "ja": "あなたのことがうれしいよ。", "page": 24}, {"id": "1184", "no": 1184, "en": "What a surprise.", "ja": "びっくりした。", "page": 24}, {"id": "1185", "no": 1185, "en": "Sounds fun.", "ja": "楽しそう。", "page": 24}, {"id": "1186", "no": 1186, "en": "I'm glad to hear that.", "ja": "それを聞いてうれしいです。", "page": 24}, {"id": "1187", "no": 1187, "en": "I'm home.", "ja": "I'm home.", "page": 24}, {"id": "1188", "no": 1188, "en": "Dinner is ready.", "ja": "Dinner is ready.", "page": 24}, {"id": "1189", "no": 1189, "en": "Please set the table.", "ja": "Please set the table.", "page": 24}, {"id": "1190", "no": 1190, "en": "Don't forget to lock the door.", "ja": "Don't forget to lock the door.", "page": 24}, {"id": "1191", "no": 1191, "en": "Can you take out the trash?", "ja": "Can you take out the trash?", "page": 24}, {"id": "1192", "no": 1192, "en": "I'm doing the laundry.", "ja": "I'm doing the laundry.", "page": 24}, {"id": "1193", "no": 1193, "en": "Please clean your room.", "ja": "Please clean your room.", "page": 24}, {"id": "1194", "no": 1194, "en": "The room is dark.", "ja": "The room is dark.", "page": 24}, {"id": "1195", "no": 1195, "en": "Turn on the light, please.", "ja": "Turn on the light, please.", "page": 24}, {"id": "1196", "no": 1196, "en": "Let's meet in front of the station.", "ja": "Let's meet in front of the station.", "page": 24}, {"id": "1197", "no": 1197, "en": "I'll be back.", "ja": "戻ります。", "page": 25}, {"id": "1198", "no": 1198, "en": "I have an appointment.", "ja": "約束があります。", "page": 25}, {"id": "1199", "no": 1199, "en": "I need to make a copy.", "ja": "コピーを取る必要があります。", "page": 25}, {"id": "1200", "no": 1200, "en": "I was stuck in traffic.", "ja": "渋滞にはまっていました。", "page": 25}, {"id": "1201", "no": 1201, "en": "It's just around the corner.", "ja": "すぐそこの角です。", "page": 25}, {"id": "1202", "no": 1202, "en": "I'm on my break.", "ja": "休憩中です。", "page": 25}, {"id": "1203", "no": 1203, "en": "I want to go again.", "ja": "また行きたいです。", "page": 25}, {"id": "1204", "no": 1204, "en": "This is my first time.", "ja": "これが初めてです。", "page": 25}, {"id": "1205", "no": 1205, "en": "This is my second time.", "ja": "これで2回目です。", "page": 25}, {"id": "1206", "no": 1206, "en": "I'm looking forward to it.", "ja": "楽しみにしています。", "page": 25}, {"id": "1207", "no": 1207, "en": "There's a big lake there.", "ja": "そこには大きな湖があります。", "page": 25}, {"id": "1208", "no": 1208, "en": "It's too crowded.", "ja": "人が多すぎます。", "page": 25}, {"id": "1209", "no": 1209, "en": "It's my piece of cake.", "ja": "それは私のケーキです。", "page": 25}]</script><script>
const DATA=JSON.parse(document.getElementById('data').textContent), KEY='eiken3-vocab-done-v1', $=id=>document.getElementById(id);
let done={},limit=100;
try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))done=x}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(done));$('status').textContent='このブラウザに保存済み'}catch(e){$('status').textContent='保存できません。バックアップを書き出してください。'}}
function render(reset=false){if(reset)limit=100;const q=$('q').value.trim().toLowerCase();const hits=DATA.filter(r=>($('showDone').checked||!done[r.id])&&(!q||[r.en,r.ja,String(r.no)].some(v=>v.toLowerCase().includes(q))));
$('tb').innerHTML=hits.slice(0,limit).map(r=>'<tr><td class="no">'+r.no+'</td><td class="en">'+esc(r.en)+'</td><td class="meaning">'+esc(r.ja)+'</td><td>'+r.page+'</td><td class="chk"><input type="checkbox" aria-label="'+esc(r.en)+' を覚えた" data-id="'+r.id+'" '+(done[r.id]?'checked':'')+'></td></tr>').join('');
const count=DATA.filter(r=>done[r.id]).length;$('cnt').textContent=hits.length.toLocaleString()+'件 ／ 覚えた '+count.toLocaleString()+' / '+DATA.length.toLocaleString()+' ('+Math.round(count/DATA.length*100)+'%)';$('more').hidden=hits.length<=limit;$('empty').hidden=hits.length>0;document.body.classList.toggle('hide-meaning',$('hideMeaning').checked)}
$('tb').addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;if(e.target.checked)done[id]=true;else delete done[id];persist();render()});
$('q').oninput=()=>render(true);$('showDone').onchange=()=>render(true);$('hideMeaning').onchange=()=>render();$('more').onclick=()=>{limit+=100;render()};
function code(){return JSON.stringify({version:1,dataset:KEY,done:Object.keys(done).filter(id=>done[id])})}
$('bk').onclick=()=>{$('code').value=code();$('inp').value='';$('msg').textContent='';$('dlg').showModal()};$('cl').onclick=()=>$('dlg').close();
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(code());$('msg').textContent='コピーしました。'}catch(e){$('code').select();$('msg').textContent='上のコードを手動でコピーしてください。'}};
$('sv').onclick=()=>{const a=document.createElement('a');const u=URL.createObjectURL(new Blob([code()],{type:'application/json'}));a.href=u;a.download=KEY+'-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
function imp(replace){try{const x=JSON.parse($('inp').value);const valid=new Set(DATA.map(r=>r.id));if(x.version!==1||x.dataset!==KEY||!Array.isArray(x.done)||x.done.some(id=>typeof id!=='string'||!valid.has(id)))throw Error();if(replace)done={};for(const id of x.done)done[id]=true;persist();render(true);$('msg').textContent='取り込みました。'}catch(e){$('msg').textContent='この級のバックアップコードを貼り付けてください。'}}
$('mg').onclick=()=>imp(false);$('rp').onclick=()=>imp(true);render();
</script></body></html>
